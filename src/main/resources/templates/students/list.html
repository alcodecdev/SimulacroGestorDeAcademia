<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Students List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:insert="layout/menu :: menu"></div>
<div class="container mt-4">

    <h2>Student List</h2>
    <a th:href="@{/students/new}" class="btn btn-primary mb-3">New Student</a>

    <table class="table table-striped">
        <thead>
        <tr><th>Name</th><th>email</th><th>Actions</th></tr>
        </thead>
        <tbody>
        <tr th:each="st : ${students}">
            <td th:text="${st.name}"></td>
            <td th:text="${st.email}"></td>
            <td>
                <a th:href="@{/students/{id}(id=${st.id})}" class="btn btn-info btn-sm">Detail</a>
                <a th:href="@{/students/edit/{id}(id=${st.id})}" class="btn btn-info btn-sm">Edit</a>
                <a th:href="@{/students/delete/{id}(id=${st.id})}" class="btn btn-info btn-sm">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
