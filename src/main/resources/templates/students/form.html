<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Academic Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:insert="layout/menu :: menu"></div>

<h2 th:text="${student.id} != null ? 'Modified Studnet' : 'New Student'"></h2>

<form th:action="@{/students/guardar}" th:object="${student}" method="post">

    <input type="hidden" th:field="*{id}" />

    <div class="form-group" th:classappend="${#fields.hasErrors('name')}? 'has-error'">
        <label>Nombre:</label>
        <input type="text" th:field="*{name}" class="form-control" placeholder="Ingrese el nombre" required/>
        <div class="help-block" th:errors="*{name}"></div>
    </div>

    <div class="form-group" th:classappend="${#fields.hasErrors('email')}? 'has-error'">
        <label>Email:</label>
        <input type="text" th:field="*{email}" class="form-control" placeholder="Ingrese el email" required/>
        <div class="help-block" th:errors="*{email}"></div>
    </div>

    <div class="form-group" th:classappend="${#fields.hasErrors('moduleIds')}? 'has-error'">
        <label>Modules:</label>
        <div th:each="m : ${modules}">
            <label>
                <input type="checkbox" th:value="${m.id}" th:field="*{moduleIds}">
                <span th:text="${m.name}"></span>
            </label>
        </div>
        <div class="help-block" th:errors="*{moduleIds}"></div>
    </div>

    <button type="submit" class="btn btn-primary">Enviar</button>
    <a href="/students" class="btn btn-default">Cancelar</a>

</form>

</body>
</html>
