<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Teachers List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:insert="layout/menu :: menu"></div>

<div class="container mt-4">
    <h2>Teachers List</h2>
    <a th:href="@{/teachers/new}" class="btn btn-primary mb-3">New Teacher</a>


    <table class="table table-striped">
        <thead>
        <tr><th>ID</th><th>Name</th><th>Specialty</th><th>Actions</th></tr>
        </thead>
        <tbody>
        <tr th:each="teacher : ${teachers}">
            <td th:text="${teacher.id}"></td>
            <td th:text="${teacher.name}"></td>
            <td th:text="${teacher.specialty}"></td>
            <td>
                <a th:href="@{/teachers/{id}(id=${teacher.id})}" class="btn btn-info btn-sm">Detail</a>
                <a th:href="@{/teachers/edit/{id}(id=${teacher.id})}" class="btn btn-info btn-sm">Edit</a>
                <a th:href="@{/teachers/delete/{id}(id=${teacher.id})}" class="btn btn-info btn-sm">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
