<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Teacher Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:insert="layout/menu :: menu"></div>

<div class="container mt-4">
    <h2>Teacher Detail</h2>

    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title" th:text="${teacher.name}">Teacher Name</h5>
            <p class="card-text">
                <strong>Specialty:</strong> <span th:text="${teacher.specialty}"></span>
            </p>
        </div>
    </div>

    <h4>Modules Taught</h4>
    <table class="table table-bordered">
        <thead class="table-light">
        <tr><th>Name</th><th>Credits</th></tr>
        </thead>
        <tbody>
        <tr th:each="module : ${teacher.modules}">
            <td th:text="${module.name}"></td>
            <td th:text="${module.credits}"></td>
        </tr>
        </tbody>
    </table>

    <a href="/teachers" class="btn btn-secondary">Back to List</a>
</div>
</body>
</html>
