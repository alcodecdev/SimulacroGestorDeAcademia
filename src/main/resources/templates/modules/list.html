<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modules List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:insert="layout/menu :: menu"></div>

<div class="container mt-4">
    <h2>Modules List</h2>
    <a href="/modules/new" class="btn btn-primary mb-3">New Module</a>

    <table class="table table-striped">
        <thead>
        <tr><th>Name</th><th>Credits</th><th>Teacher</th><th>Actions</th></tr>
        </thead>
        <tbody>
        <tr th:each="module : ${modules}">
            <td th:text="${module.name}"></td>
            <td th:text="${module.credits}"></td>
            <td th:text="${module.teacher.name}"></td>
            <td>
                <a th:href="@{/modules/{id}(id=${module.id})}" class="btn btn-info btn-sm">Detail</a>
                <a th:href="@{/modules/edit/{id}(id=${module.id})}" class="btn btn-info btn-sm">Edit</a>
                <a th:href="@{/modules/delete/{id}(id=${module.id})}" class="btn btn-info btn-sm">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
