<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div th:insert="layout/menu :: menu"></div>

<h2 th:text="${module.id} != null ? 'Modified Module' : 'New Module'"></h2>

<form th:action="@{/modules/guardar}" th:object="${module}" method="post">

    <input type="hidden" th:field="*{id}" />

    <div class="form-group" th:classappend="${#fields.hasErrors('name')}? 'has-error'">
        <label>Nombre:</label>
        <input type="text" th:field="*{name}" class="form-control" placeholder="Ingrese el nombre" required/>
        <div class="help-block" th:errors="*{name}"></div>
    </div>

    <div class="form-group" th:classappend="${#fields.hasErrors('credits')}? 'has-error'">
        <label>Creditos:</label>
        <input type="number" th:field="*{credits}" class="form-control" placeholder="Ingrese el credito" required/>
        <div class="help-block" th:errors="*{credits}"></div>
    </div>

    <div class="form-group" th:classappend="${#fields.hasErrors('teacherId')} ? 'has-error'">
        <label>Teachers:</label>
        <select class="form-control" th:field="*{teacherId}">
            <option value="" th:if="${module.teacherId == null}" selected>Selecciona un profesor</option>

            <!-- Opciones de profesores -->
            <option th:each="t : ${teachers}"
                    th:value="${t.id}"
                    th:text="${t.name}"
                    th:selected="${module.teacherId != null} ? ${module.teacherId == t.id} : false">
            </option>
        </select>
        <div class="help-block" th:errors="*{teacherId}"></div>
    </div>

    <div class="form-group" th:classappend="${#fields.hasErrors('studentIds')}? 'has-error'">
        <label>Students:</label>
        <div th:each="s : ${students}">
            <label>
                <input type="checkbox" th:value="${s.id}" th:field="*{studentIds}">
                <span th:text="${s.name}"></span>
            </label>
        </div>
        <div class="help-block" th:errors="*{studentIds}"></div>
    </div>

    <button type="submit" class="btn btn-primary">Enviar</button>
    <a href="/modules" class="btn btn-default">Cancelar</a>

</form>
</body>
</html>
