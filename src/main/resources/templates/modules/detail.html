<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Module Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:insert="layout/menu :: menu"></div>

<div class="container mt-4">
    <h2>Module Detail</h2>

    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title" th:text="${module.name}">Module Name</h5>
            <p class="card-text">
                <strong>ID:</strong> <span th:text="${module.id}"></span><br>
                <strong>Credits:</strong> <span th:text="${module.credits}"></span><br>
                <strong>Teacher:</strong><span th:text="${module.teacher != null ? module.teacher.name : 'Sin profesor'}"></span>
            </p>
        </div>
    </div>

    <h4>Enrolled Students</h4>
    <table class="table table-bordered">
        <thead class="table-light">
        <tr><th>ID</th><th>Name</th><th>Email</th></tr>
        </thead>
        <tbody>
        <tr th:each="student : ${module.students}">
            <td th:text="${student.id}"></td>
            <td th:text="${student.name}"></td>
            <td th:text="${student.email}"></td>
        </tr>
        </tbody>
    </table>

    <a href="/modules" class="btn btn-secondary">Back to List</a>
</div>
</body>
</html>
